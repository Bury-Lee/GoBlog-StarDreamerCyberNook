<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面走丢了</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #e2e8f0;
            background-color: #070b14;
        }

        /* 背景:霓虹光晕 + 网格 */
        .bg-glow,
        .bg-grid {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .bg-glow {
            background:
                radial-gradient(600px 300px at 15% 10%, rgba(34, 211, 238, 0.16), transparent 65%),
                radial-gradient(560px 320px at 85% 20%, rgba(168, 85, 247, 0.16), transparent 62%),
                radial-gradient(500px 300px at 50% 110%, rgba(129, 140, 248, 0.14), transparent 65%);
        }

        .bg-grid {
            background-image:
                linear-gradient(rgba(34, 211, 238, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 211, 238, 0.06) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 78%);
            -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 78%);
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 560px;
            padding: 46px 36px 40px;
            text-align: center;
            border: 1px solid #1e2b45;
            border-radius: 14px;
            background: rgba(9, 14, 26, 0.82);
            box-shadow: 0 18px 40px -24px rgba(34, 211, 238, 0.45);
            backdrop-filter: blur(6px);
            animation: rise 0.5s ease-out both;
        }

        .error-code {
            font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
            font-size: 104px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 4px;
            background: linear-gradient(92deg, #67e8f9 0%, #a5b4fc 48%, #d8b4fe 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 18px rgba(34, 211, 238, 0.35));
        }

        .error-title {
            margin-top: 14px;
            font-size: 24px;
            font-weight: 600;
            color: #e2e8f0;
        }

        .error-desc {
            margin-top: 12px;
            font-size: 14px;
            line-height: 1.9;
            color: #94a3b8;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .btn {
            display: inline-block;
            padding: 11px 26px;
            border-radius: 999px;
            border: 1px solid transparent;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            color: #041016;
            background: linear-gradient(92deg, #22d3ee, #818cf8);
            box-shadow: 0 0 18px rgba(34, 211, 238, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 26px rgba(34, 211, 238, 0.55);
        }

        .btn-ghost {
            color: #94a3b8;
            border-color: #2b3d61;
            background: rgba(30, 43, 69, 0.35);
        }

        .btn-ghost:hover {
            color: #22d3ee;
            border-color: rgba(34, 211, 238, 0.6);
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 640px) {
            .card {
                padding: 34px 22px 30px;
            }

            .error-code {
                font-size: 72px;
            }

            .error-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-grid"></div>

    <main class="card">
        <div class="error-code">404</div>
        <h1 class="error-title">页面走丢了</h1>
        <p class="error-desc">
            你访问的页面不存在或已被移动。<br>
            检查一下地址,或者回到首页继续逛吧。
        </p>
        <div class="actions">
            <a class="btn btn-primary" href="/">返回首页</a>
            <a class="btn btn-ghost" href="javascript:history.back()">返回上一页</a>
        </div>
    </main>
</body>
</html>
